<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Compacted prototype</title>
<style>
  :root {
    --bg: #15171c; --panel: #1f2229; --panel2: #272b34; --border: #3a3f4b; --text: #e6e8ec; --muted: #9aa1ad;
    --accent: #5b9cf0; --fluid: #4ea8f0; --in: #4cc38a; --out: #f0b44c; --off: #5a606c; --danger: #e5605a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; user-select: none; }
  canvas { display: block; }
  button { font: inherit; color: var(--text); background: var(--panel2); border: 1px solid var(--border); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  button:hover { border-color: var(--muted); }
  button.on { border-color: var(--accent); color: var(--accent); }
  button.danger { border-color: var(--danger); color: var(--danger); }
  select, input[type=text] { font: inherit; color: var(--text); background: var(--panel2); border: 1px solid var(--border); border-radius: 6px; padding: 3px 6px; }
  kbd { font: 11px ui-monospace, monospace; color: var(--muted); border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; }
  .hidden { display: none !important; }
  .box { position: absolute; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; }

  #top { position: absolute; top: 10px; left: 12px; display: flex; gap: 10px; align-items: center; }
  #crumb span.c { cursor: pointer; color: var(--muted); }
  #crumb span.c:hover { color: var(--text); }
  #crumb span.cur { color: var(--text); font-weight: 600; }
  #crumb .sep { color: var(--off); margin: 0 6px; }
  #mode { position: absolute; top: 12px; right: 52px; color: var(--muted); }
  #mode.destroy { color: var(--danger); }

  #side { position: absolute; right: 0; top: 60px; display: flex; flex-direction: column; gap: 8px; }
  .lbl { writing-mode: vertical-rl; padding: 12px 7px; background: var(--panel); border: 1px solid var(--border); border-right: none; border-radius: 8px 0 0 8px; cursor: pointer; }
  .lbl.on { color: var(--accent); border-color: var(--accent); }
  .bigwin { left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(860px, 90vw); height: min(560px, 78vh); overflow: auto; padding: 14px 18px; z-index: 5; }
  .bigwin .ph { font-size: 16px; }
  .crow { display: grid; grid-template-columns: 180px 1fr auto; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .crow .cname { font-weight: 500; }
  .crow .cname small { display: block; color: var(--muted); font-weight: 400; }
  .crow .cin { color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 14px; }
  .crow .cin .lack { color: var(--danger); }
  .crow .cbtns { display: flex; gap: 6px; }
  .crow button.dim { opacity: .45; }
  .tcanvas { overflow-x: auto; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); margin-bottom: 10px; }
  .tnode { position: absolute; display: flex; align-items: center; justify-content: center; text-align: center; padding: 4px 6px; border-radius: 8px; border: 1px solid var(--border); background: var(--panel2); cursor: pointer; font-size: 12px; line-height: 1.2; }
  .tnode.done { border-color: var(--in); color: var(--in); }
  .tnode.open { border-color: var(--text); }
  .tnode.sel { outline: 2px solid var(--accent); outline-offset: 2px; }
  .tdetail .row { align-items: flex-start; padding: 3px 0; }
  .tdetail .cin { color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 14px; justify-content: flex-end; }
  .cin .lack { color: var(--danger); }
  button.dim { opacity: .45; }
  .matgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 4px 24px; }

  #bar { position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; align-items: center; }
  .slot { width: 52px; height: 52px; border: 1px solid var(--border); border-radius: 8px; background: var(--panel); position: relative; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .slot.sel { border: 2px solid var(--accent); }
  .slot .k { position: absolute; top: 2px; left: 5px; font-size: 11px; color: var(--muted); }
  .slot .n { position: absolute; bottom: 2px; right: 5px; font-size: 11px; color: var(--muted); }
  .slot.destroy { color: var(--danger); font-size: 20px; }
  .slot.destroy.sel { border-color: var(--danger); background: #3a2224; }
  .divider { width: 1px; height: 40px; background: var(--border); margin: 0 4px; }

  .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); margin-bottom: 10px; }
  .tab { padding: 6px 12px; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; }
  .tab.on { color: var(--text); border-bottom-color: var(--accent); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
  .bi { border: 1px solid var(--border); border-radius: 8px; padding: 12px 6px; text-align: center; cursor: pointer; font-size: 12px; color: var(--muted); }
  .bi:hover { border-color: var(--accent); color: var(--text); }
  .bi canvas { display: block; margin: 0 auto 4px; }

  #popup { width: 250px; }
  .ph { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-weight: 600; }
  .ph button { padding: 0 6px; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; color: var(--muted); min-height: 26px; }
  .row b { color: var(--text); font-weight: 500; }
  .sec { margin-top: 8px; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .seg { display: flex; gap: 3px; }
  .seg button { padding: 2px 7px; }
  .prog { height: 4px; background: var(--panel2); border-radius: 2px; margin-top: 6px; }
  .prog div { height: 4px; background: var(--in); border-radius: 2px; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
  #ports { width: 196px; }
  .pgrid { display: grid; grid-template-columns: repeat(3, 52px); grid-template-rows: repeat(3, 52px); gap: 4px; justify-content: center; margin: 4px 0 8px; }
  .pbox { display: flex; align-items: center; justify-content: center; background: #2a2140; border: 2px solid #9a7ad0; border-radius: 8px; font-weight: 600; }
  .pbox.mbox { border-color: rgba(255,255,255,.25); }
  .pbtn { position: relative; width: 44px; height: 44px; margin: auto; padding: 0; border-radius: 50%; border: none; display: flex; align-items: center; justify-content: center; color: var(--bg); }
  .pbtn:hover { outline: 2px solid var(--text); outline-offset: 2px; }
  .pbtn.in { background: var(--in); }
  .pbtn.out { background: var(--out); }
  .pbtn.fluid { background: var(--fluid); }
  .pbtn.off { background: var(--panel2); border: 1px solid var(--border); color: var(--muted); }
  .pbtn .dash { width: 14px; height: 3px; background: currentColor; border-radius: 2px; }
  .pbtn .pl { position: absolute; top: -2px; right: -4px; font-size: 10px; color: var(--muted); }
  .plegend { display: flex; justify-content: center; gap: 12px; color: var(--muted); font-size: 12px; }
  .plegend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 4px; }
  .phint { text-align: center; color: var(--muted); font-size: 11px; margin-top: 6px; }

  #confirm { left: 50%; top: 40%; transform: translate(-50%, -50%); width: 280px; }
  .warn { color: var(--out); margin-top: 6px; }
  .acts { display: flex; justify-content: flex-end; gap: 6px; margin-top: 10px; }

  #pause { inset: 0; position: absolute; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; }
  #pause .box { position: static; width: 260px; display: flex; flex-direction: column; gap: 8px; }
  #pause h2 { margin: 0 0 4px; font-size: 16px; font-weight: 600; }
  #settings { border-top: 1px solid var(--border); padding-top: 8px; }

  #toast { position: absolute; left: 50%; bottom: 150px; transform: translateX(-50%); background: var(--panel2); border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  #toast.show { opacity: 1; }
  #hint { position: absolute; left: 12px; bottom: 80px; color: var(--muted); font-size: 11px; line-height: 1.7; max-width: 220px; }
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="top">
  <button id="leave" title="Leave to the parent dimension">⟵ Leave</button>
  <div id="crumb"></div>
</div>
<div id="mode"></div>

<div id="side">
  <div class="lbl" id="lblMat">Materials</div>
  <div class="lbl" id="lblTech">Tech tree</div>
  <div class="lbl" id="lblCraft">Crafting</div>
</div>
<div id="panel" class="box bigwin hidden"></div>

<div id="bar"></div>
<div id="browser" class="box bigwin hidden"></div>
<div id="popup" class="box hidden"></div>
<div id="ports" class="box hidden"></div>
<div id="confirm" class="box hidden"></div>

<div id="pause" class="hidden">
  <div class="box">
    <h2>Paused</h2>
    <button data-p="resume">Resume</button>
    <button data-p="save">Save</button>
    <button data-p="load">Load</button>
    <button data-p="settings">Settings</button>
    <div id="settings" class="hidden">
      <div class="row"><span>Free build (debug)</span><input type="checkbox" id="optFree"></div>
      <div class="row"><span>Simulation speed</span><select id="optSpeed"><option value="1">1×</option><option value="2">2×</option><option value="4">4×</option><option value="10">10×</option></select></div>
      <div class="row"><span>Tech (debug)</span><button data-p="alltech">Complete all</button></div>
    </div>
    <button data-p="quit">Quit (new game)</button>
  </div>
</div>

<div id="toast"></div>
<div id="hint">
  <kbd>WASD</kbd> camera · <kbd>1–9</kbd> slot · <kbd>R</kbd> rotate<br>
  <kbd>LMB</kbd> place / inspect · <kbd>RMB</kbd> deselect<br>
  <kbd>Q</kbd> destroy · <kbd>Tab</kbd> materials · <kbd>T</kbd> tech · <kbd>C</kbd> craft<br>
  <kbd>Esc</kbd> close / pause · double-click a controller to enter
</div>

<script src="content.js"></script>
<script src="sim.js"></script>
<script src="game.js"></script>
</body>
</html>
